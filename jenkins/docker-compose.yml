services:
  jenkins:
    build: .
    container_name: jenkins-lab
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    volumes:
      - jenkins_home:/var/jenkins_home
      - ..:/lab:ro
    restart: unless-stopped

volumes:
  jenkins_home: